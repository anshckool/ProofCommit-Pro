<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔬</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ProofCommit Pro — AI-Powered Automated Code Review & 9AM Developer Skill Evidence Certificate. Neural Storm 2026 · Track 1: Future Tech · FT-05" />
    <meta name="theme-color" content="#020617" />
    <title>ProofCommit Pro — AI Automated Code Review &amp; 9AM Skill Evidence</title>

    <!-- Google Fonts: Inter + JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />

    <!-- Razorpay Standard Checkout -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <style>
      /* Base dark background before React mounts */
      html, body { background-color: #020617; margin: 0; padding: 0; }
      #root { min-height: 100vh; }

      /* Custom scrollbar */
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: #0f172a; }
      ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: #475569; }

      /* Print styles for certificate */
      @media print {
        @page {
          size: landscape;
          margin: 8mm;
        }

        html, body {
          background-color: #020617 !important;
          color: #ffffff !important;
          margin: 0 !important;
          padding: 0 !important;
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }

        /* Hide all page content except the certificate modal */
        .no-print, nav, header, footer {
          display: none !important;
        }

        #root > div > *:not(#cert-print-root) {
          display: none !important;
        }

        #cert-print-root {
          position: fixed !important;
          inset: 0 !important;
          display: flex !important;
          align-items: center !important;
          justify-content: center !important;
          background: #020617 !important;
          padding: 0 !important;
          margin: 0 auto !important;
          width: 100% !important;
          height: 100% !important;
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }

        #cert-printable {
          display: block !important;
          width: 100% !important;
          max-width: 920px !important;
          margin: auto !important;
          background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%) !important;
          background-color: #0f172a !important;
          border: 2px solid #6366f1 !important;
          box-shadow: none !important;
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
          page-break-inside: avoid !important;
        }

        #cert-printable * {
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
